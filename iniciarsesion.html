<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión</title>
    <link rel="stylesheet" href="estilos/index.css">
    <link rel="stylesheet" href="estilos/iniciarsesion.css">
    
</head>
<body>
    <header>
        <nav>
            <img class="imagenLogo" src="imagenes/LogoEmpresa.png" alt="logo">
            <h1>Farmacia Sante</h1>
            <div class="enlacesPrincipales">
                <a href="index.html">Página Principal</a>
                <a href="galeria.html">Galería</a>
            </div>
        </nav>
    </header>
    <img class="imagenPrincipal" src="imagenes/EmpresaImagen.png" alt="ImagenPrincipal">
    <main>
        <form action="" method="post" class="formularioInicioSesion">
            <table class="estructura">
                <tr>
                    <th class="espacioCampoFormTitulo" align="center"><h3>Iniciar Sesión</h3></th>
                </tr>
                <tr>
                    <td class="espacioCampoFormEmail" align="center">
                        <label for="email" ><strong>Email</strong></label>
                        <input type="text" name="email" id="textEmail" placeholder="xxxx@gmail.com"> 
                    </td>
                </tr>
                <tr>
                    <td class="espacioCampoFormClave" align="center">
                        <label for="password"><Strong>Password</Strong></label>
                        <input type="text" name="password" id="textPassword" placeholder="xxxxxxxx">
                    </td>
                </tr>
                <tr>
                    <td  align="center">
                        <button class="botonLogin">Login</button>
                    </td>
                </tr>
            </table>
        </form>
    </main> 
    <footer>
        <p>Desarrollador: <strong>Martín Andrés Leiva Feddersen</strong></p>
    </footer>
</body>
</html>
