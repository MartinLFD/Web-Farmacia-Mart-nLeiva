<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión</title>
    <link rel="stylesheet" href="estilos/index.css">
    
</head>
    <header>
        <img src="imagenes/LogoEmpresa.png" alt="logo">
        <h2>Farmacia Sante</h2>
        <nav>
            <a href="index.html">Página Principal</a>
            <a href="galeria.html">Galería</a>
        </nav>
        <img src="imagenes/EmpresaImgaen.png" alt="ImagenPrincipal">

    <body>
        <form action="" method="post" class="formularioInicioSesion">
            <table>
                <tr>
                    <th align="center"><h3>Iniciar Sesión</h3></th>
                </tr>
                <tr>
                    <td class="espacioCampoForm" align="center">
                        <label for="email" ><strong>Email</strong></label>
                        <input type="text" name="email" id="textEmail" placeholder="xxxx@gmail.com"> 
                    </td>
                </tr>
                <tr>
                    <td class="espacioCampoForm" align="center">
                        <label for="password"><Strong>Password</Strong></label>
                        <input type="text" name="password" id="textPassword" placeholder="xxxxxxxx">
                    </td>
                </tr>
                <tr>
                    <td class="botonLogin" align="center">
                        <button >Login</button>
                    </td>
                </tr>
            </table>
        </form>
        
    </body>
